/* --------------------------------- Reveal ---------------------------------- */

function Reveal({ children, className = '', delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const node = ref.current;
    if (!node) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
    }, { threshold: 0.12 });
    obs.observe(node);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref}
      style={{ transitionDelay: `${delay}ms` }}
      className={`transition-all duration-700 ease-out ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'} ${className}`}>
      {children}
    </div>
  );
}

];

function MoonIconAlias(p) { return <CompassIcon {...p} />; }

function Hero({ onShopClick }) {
  const [index, setIndex] = useState(0);
  const timerRef = useRef(null);
  const hoverRef = useRef(false);

  useEffect(() => {
    timerRef.current = setInterval(() => {
      if (!hoverRef.current) setIndex((i) => (i + 1) % SLIDES.length);
    }, 5000);
    return () => clearInterval(timerRef.current);
  }, []);

  const slide = SLIDES[index];
  const panelTone = {
    emerald: 'bg-gradient-to-br from-emerald-800 via-emerald-700 to-emerald-900 text-ivory-50',
    gold: 'bg-gradient-to-br from-gold-100 via-ivory-100 to-gold-50 text-emerald-900',
    ivory: 'bg-gradient-to-br from-emerald-900 via-charcoal to-emerald-800 text-ivory-50',
  };

  return (
    <section
      onMouseEnter={() => (hoverRef.current = true)}
      onMouseLeave={() => (hoverRef.current = false)}
      className={`relative overflow-hidden transition-colors duration-700 ${panelTone[slide.tone]}`}>
      <div className="absolute inset-0 opacity-[0.07] pointer-events-none" style={{ backgroundImage: PATTERN_URL, backgroundSize: '110px 110px' }} />
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 sm:py-20 lg:py-24 relative">
        <div className="grid lg:grid-cols-2 gap-10 items-center">
          <div key={index} className="animate-fade-in">
            <span className="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.16em] px-3 py-1.5 rounded-full border border-current/25 mb-5 opacity-90">
              <SparklesIcon size={13} /> {slide.tag}
            </span>
            <h1 className="font-serif font-bold text-3xl sm:text-4xl lg:text-5xl leading-[1.1] mb-5 whitespace-pre-line">{slide.title}</h1>
            <p className="text-sm sm:text-base opacity-85 max-w-md mb-8 leading-relaxed">{slide.text}</p>
            <button onClick={onShopClick} className="group inline-flex items-center gap-2 bg-gold-500 text-emerald-900 font-semibold text-sm sm:text-base px-6 py-3 rounded-full hover:bg-gold-400 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gold-500">
              {slide.cta} <ArrowRightIcon size={17} className="transition-transform group-hover:translate-x-1" />
            </button>
          </div>
          <div className="hidden lg:flex justify-center">
            <div key={`v-${index}`} className="w-64 h-80 animate-fade-in">
              <ArchVisual Icon={slide.icon} tone={slide.tone === 'gold' ? 'ivory' : 'gold'} />
            </div>
          </div>
        </div>

        <div className="flex items-center gap-4 mt-10 sm:mt-14">
          <button aria-label="Previous slide" onClick={() => setIndex((i) => (i - 1 + SLIDES.length) % SLIDES.length)}
            className="w-9 h-9 rounded-full border border-current/25 flex items-center justify-center hover:bg-white/10 transition-colors focus:outline-none focus:ring-2 focus:ring-gold-500">
            <ChevronLeft size={17} />
          </button>
          <div className="flex items-center gap-2">
            {SLIDES.map((_, i) => (
              <button key={i} aria-label={`Go to slide ${i + 1}`} onClick={() => setIndex(i)}
                className={`h-1.5 rounded-full transition-all ${i === index ? 'w-7 bg-gold-500' : 'w-1.5 bg-current/30'}`} />
            ))}
          </div>
          <button aria-label="Next slide" onClick={() => setIndex((i) => (i + 1) % SLIDES.length)}
            className="w-9 h-9 rounded-full border border-current/25 flex items-center justify-center hover:bg-white/10 transition-colors focus:outline-none focus:ring-2 focus:ring-gold-500">
            <ChevronRight size={17} />
          </button>
        </div>
      </div>
    </section>
  );
}

  );
}

/* --------------------------------- QuickView --------------------------------- */

function QuickViewModal({ product, onClose, onAdd }) {
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  if (!product) return null;
  const CatIcon = CAT_ICON[product.category] || BookIcon;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div onClick={onClose} className="absolute inset-0 bg-emerald-950/50 backdrop-blur-[2px] animate-fade-in" />
      <div role="dialog" aria-modal="true" aria-label={product.name}
        className="relative bg-ivory-50 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl animate-fade-in">
        <button onClick={onClose} aria-label="Close quick view"
          className="absolute top-3 right-3 z-10 w-8 h-8 rounded-full bg-white/90 flex items-center justify-center hover:bg-white focus:outline-none focus:ring-2 focus:ring-gold-500">
          <XIcon size={17} />
        </button>
        <div className="grid sm:grid-cols-2">
          <div className="p-6 sm:p-7">
            <div className="w-full aspect-square"><ArchVisual Icon={CatIcon} tone="emerald" /></div>
          </div>
          <div className="p-6 sm:p-7 sm:pl-0 flex flex-col">
            {product.badge && <span className="self-start bg-gold-500 text-emerald-900 text-[10px] font-bold uppercase tracking-wide px-2.5 py-1 rounded-full mb-3">{product.badge}</span>}
            <span className="text-[11px] font-semibold uppercase tracking-wide text-emerald-700/80 mb-1">{product.category}</span>
            <h3 className="font-serif font-bold text-xl text-charcoal leading-snug mb-2">{product.name}</h3>
            <Rating rating={product.rating} reviews={product.reviews} />
            <p className="text-sm text-charcoal-600 leading-relaxed my-4">{product.desc}</p>
            <div className="mt-auto">
              <div className="flex items-baseline gap-2 mb-4">
                <span className="font-serif font-bold text-2xl text-emerald-900">{formatPKR(product.price)}</span>
                {product.originalPrice && <span className="text-sm text-charcoal-600/60 line-through">{formatPKR(product.originalPrice)}</span>}
              </div>
              <button onClick={() => { onAdd(product); onClose(); }}
                className="w-full bg-emerald-700 text-white font-semibold text-sm py-3 rounded-full hover:bg-emerald-800 transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gold-500">
                <BagIcon size={16} /> Add to Cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ----------------------------------- Toast ----------------------------------- */

function Toast({ toast }) {
  if (!toast) return null;
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-6 sm:translate-x-0 z-[60] animate-toast-in">
      <div className="flex items-center gap-3 bg-emerald-900 text-ivory-50 pl-3 pr-5 py-3 rounded-full shadow-xl border border-gold-400/40">
        <span className="w-7 h-7 rounded-full bg-gold-500 flex items-center justify-center shrink-0">
          <CheckIcon size={14} className="text-emerald-900" />
        </span>
        <span className="text-sm font-medium whitespace-nowrap">{toast}</span>
      </div>
    </div>
  );
}

/* ------------------------------------ App ------------------------------------ */

function App() {
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [bump, setBump] = useState(false);
  const [search, setSearch] = useState('');
  const [activeCategory, setActiveCategory] = useState('All');
  const [sortBy, setSortBy] = useState('popularity');
  const [quickViewProduct, setQuickViewProduct] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const bumpTimer = useRef(null);

  const showToast = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  }, []);

  const triggerBump = useCallback(() => {
    setBump(false);
    requestAnimationFrame(() => {
      setBump(true);
      clearTimeout(bumpTimer.current);
      bumpTimer.current = setTimeout(() => setBump(false), 420);
    });
  }, []);

  const addToCart = useCallback((product) => {
    setCart((prev) => {
      const existing = prev.find((it) => it.product.id === product.id);
      if (existing) return prev.map((it) => it.product.id === product.id ? { ...it, qty: it.qty + 1 } : it);
      return [...prev, { product, qty: 1 }];
    });
    showToast(`${product.name.length > 34 ? product.name.slice(0, 34) + '…' : product.name} added to cart`);
    triggerBump();
  }, [showToast, triggerBump]);

  const incQty = useCallback((id) => setCart((prev) => prev.map((it) => it.product.id === id ? { ...it, qty: it.qty + 1 } : it)), []);
  const decQty = useCallback((id) => setCart((prev) => prev.flatMap((it) => {
    if (it.product.id !== id) return [it];
    return it.qty <= 1 ? [] : [{ ...it, qty: it.qty - 1 }];
  })), []);
  const removeItem = useCallback((id) => setCart((prev) => prev.filter((it) => it.product.id !== id)), []);

  const cartCount = useMemo(() => cart.reduce((sum, it) => sum + it.qty, 0), [cart]);
  const subtotal = useMemo(() => cart.reduce((sum, it) => sum + it.qty * it.product.price, 0), [cart]);

  const filteredProducts = useMemo(() => {
    let list = PRODUCTS.filter((p) => {
      const matchesCategory = activeCategory === 'All' || p.category === activeCategory;
      const q = search.trim().toLowerCase();
      const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
      return matchesCategory && matchesSearch;
    });
    if (sortBy === 'price-asc') list = [...list].sort((a, b) => a.price - b.price);
    else if (sortBy === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
    else list = [...list].sort((a, b) => b.popularity - a.popularity);
    return list;
  }, [search, activeCategory, sortBy]);

  const handleCheckout = useCallback(() => {
    showToast('Checkout is coming soon — Jazak Allah Khair for your patience!');
  }, [showToast]);

  const handleSubscribe = useCallback((email) => {
    showToast('Subscribed! Thank you for joining us.');
  }, [showToast]);

  const scrollToShop = useCallback(() => {
    document.getElementById('shop')?.scrollIntoView({ behavior: 'smooth' });
  }, []);

  return (
    <div id="top" className="min-h-screen bg-ivory-50 text-charcoal relative">
      <div className="pointer-events-none fixed inset-0 opacity-[0.035] z-0" style={{ backgroundImage: PATTERN_URL, backgroundSize: '140px 140px' }} />
      <div className="relative z-[1]">
        <Header
          cartCount={cartCount}
          bump={bump}
          onCartClick={() => setCartOpen(true)}
          search={search}
          setSearch={setSearch}
          activeCategory={activeCategory}
          setActiveCategory={setActiveCategory}
        />
        <Hero onShopClick={scrollToShop} />
        <CategoryStrip activeCategory={activeCategory} setActiveCategory={setActiveCategory} />
        <PromoBanners onCategorySelect={setActiveCategory} />
        <ProductsSection
          products={filteredProducts}
          search={search}
          setSearch={setSearch}
          activeCategory={activeCategory}
          setActiveCategory={setActiveCategory}
          sortBy={sortBy}
          setSortBy={setSortBy}
          onAdd={addToCart}
          onQuickView={setQuickViewProduct}
        />
        <TrustRow />
        <Newsletter onSubscribe={handleSubscribe} />
        <Footer />
      </div>

      <CartDrawer
        open={cartOpen}
        onClose={() => setCartOpen(false)}
        cart={cart}
        onInc={incQty}
        onDec={decQty}
        onRemove={removeItem}
        subtotal={subtotal}
        onCheckout={handleCheckout}
      />
      {quickViewProduct && (
        <QuickViewModal product={quickViewProduct} onClose={() => setQuickViewProduct(null)} onAdd={addToCart} />
      )}
      <Toast toast={toast} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
